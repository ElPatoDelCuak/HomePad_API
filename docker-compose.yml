services:
  web:
    build: .
    container_name: homepad_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3
    expose:
      - "8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - edge_network
      - data_network
    restart: unless-stopped

networks:
  edge_network:
    external: true
  data_network:
    external: true
