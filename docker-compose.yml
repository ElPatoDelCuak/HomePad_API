services:
  web:
    build: .
    container_name: homepad_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - homepad_network
    restart: unless-stopped

networks:
  homepad_network:
    name: homepad_network
